name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          # `git diff HEAD^ HEAD` needs the parent commit; checkout defaults to depth 1.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check repository whitespace
        shell: bash
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          fi
      - name: Compile group tooling and package
        run: python -m compileall -q scripts src
      - name: Run non-GPU unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
